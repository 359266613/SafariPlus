name: Build Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide
  IOS_SDK_VERSION: "16.5"
  WEBKIT_ARCHIVE_URL: ${{ vars.WEBKIT_ARCHIVE_URL }}
  BUILD_WEBCONTENT: "0"

jobs:
  build:
    name: Build (${{ matrix.build_variant }}, without WebContent)
    runs-on: macos-14
    outputs:
      package_version: ${{ steps.bump.outputs.package_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
#          - build_variant: rootful
#            package_scheme: ""
          - build_variant: rootless
            package_scheme: rootless
#          - build_variant: roothide
#            package_scheme: roothide

    steps:
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        echo "$THEOS/bin" >> "$GITHUB_PATH"
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> $HOME/.theosrc

    - name: Bump Package Version
      id: bump
      run: |
        VERSION_PREFIX="5.2.0"
        VERSION_BASE=0    
        VERSION="${VERSION_PREFIX}-$((VERSION_BASE + ${{ github.run_number }})).nowebcontent"
        echo "Using version: $VERSION"
        sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
        echo "package_version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Checkout Theos (RootHide)
      uses: actions/checkout@v4
      with:
        repository: roothide/theos
        path: theos-roothide
        submodules: recursive

    - name: Install iOS SDK
      run: |
        set -euo pipefail
        mkdir -p "$THEOS/sdks"
        SDK_NAME="iPhoneOS${IOS_SDK_VERSION}.sdk"
        if [ -d "$THEOS/sdks/$SDK_NAME" ]; then
          echo "$SDK_NAME already present"
          exit 0
        fi
        # Install the patched SDK used by build.sh, including private frameworks.
        SDK_CHECKOUT="$(mktemp -d)"
        trap 'rm -rf "$SDK_CHECKOUT"' EXIT
        git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_CHECKOUT"
        git -C "$SDK_CHECKOUT" sparse-checkout set "$SDK_NAME"
        cp -R "$SDK_CHECKOUT/$SDK_NAME" "$THEOS/sdks/"
        test -f "$THEOS/sdks/$SDK_NAME/SDKSettings.plist"
        ls -1 "$THEOS/sdks"

    - name: Install Theos dependencies
      run: |
        # dpkg 提供 dpkg-deb，make package 生成 .deb 需要它
        brew install ldid dpkg xz
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

    - name: Checkout XPC headers
      uses: actions/checkout@v4
      with:
        repository: theos/templates
        ref: 7d98646871281e5b71e280e8f80d3fc27b69aeef
        path: build-dependencies/xpc-headers
        sparse-checkout: ios/xpc_service/headers

    - name: Install XPC headers
      run: |
        mkdir -p "$THEOS/include"
        cp -R build-dependencies/xpc-headers/ios/xpc_service/headers/xpc \
          "$THEOS/include/"

    - name: Checkout libSandy
      uses: actions/checkout@v4
      with:
        repository: opa334/libSandy
        ref: 9c77311172485e92bf0c439391be5a9565c877e4
        path: build-dependencies/libSandy

    - name: Build and install libSandy for linking
      env:
        PACKAGE_SCHEME: ${{ matrix.package_scheme }}
      run: |
        set -euo pipefail
        make -C build-dependencies/libSandy \
          ONLY_LIBRARY=1 FINALPACKAGE=1 \
          THEOS_PACKAGE_SCHEME="$PACKAGE_SCHEME" \
          TARGET="iphone:clang:${IOS_SDK_VERSION}:15.0" \
          ARCHS="arm64 arm64e"
        mkdir -p "$THEOS/include" "$THEOS/lib/iphone/$PACKAGE_SCHEME"
        cp build-dependencies/libSandy/libSandy.h "$THEOS/include/"
        cp build-dependencies/libSandy/.theos/obj/libsandy.dylib \
          "$THEOS/lib/iphone/$PACKAGE_SCHEME/"

    - name: Use textual libhooker headers
      run: |
        # The dynamic libundirect header only needs libhooker's declarations.
        sed -i '' -E \
          's/^[[:space:]]*#pragma[[:space:]]+clang[[:space:]]+module[[:space:]]+import[[:space:]]+libhooker[[:space:]]*$/#include <libhooker\/libhooker.h>/' \
          "$THEOS/vendor/include/libundirect/libundirect_dynamic.h"

    - name: Build Package
      run: |
        export THEOS="$GITHUB_WORKSPACE/theos-roothide"
        SCHEME="${{ matrix.package_scheme }}"
        if [ -n "$SCHEME" ]; then
          export THEOS_PACKAGE_SCHEME="$SCHEME"
        fi
        bash build.sh
        echo "=== .deb files ==="
        find . -name "*.deb" -type f 2>/dev/null

    - name: Verify packages
      run: |
        set -euo pipefail
        shopt -s nullglob
        PACKAGES=(packages/*.deb)
        if [ "${#PACKAGES[@]}" -eq 0 ]; then
          echo "No .deb packages were produced" >&2
          exit 1
        fi
        for PACKAGE in "${PACKAGES[@]}"; do
          dpkg-deb --info "$PACKAGE"
          CONTENTS="$(dpkg-deb --contents "$PACKAGE")"
          printf '%s\n' "$CONTENTS"
          for TWEAK in SafariPlus SafariPlusSB; do
            if ! grep -Fq "/${TWEAK}.dylib" <<< "$CONTENTS"; then
              echo "Missing tweak binary: $TWEAK" >&2
              exit 1
            fi
          done
          if ! grep -Fq "/SafariPlusPrefs.bundle/" <<< "$CONTENTS"; then
            echo "Missing preferences bundle" >&2
            exit 1
          fi
          if grep -Fq "/SafariPlusWC.dylib" <<< "$CONTENTS"; then
            echo "Unexpected WebContent binary in the reduced package" >&2
            exit 1
          fi
        done

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.build_variant }}-no-webcontent
        path: |
          ./packages/*.deb
        if-no-files-found: error

    - name: Create Release
      if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ github.token }}
        tag_name: v${{ steps.bump.outputs.package_version }}
        name: Safari Plus v${{ steps.bump.outputs.package_version }} (without WebContent)
        files: |
          ./packages/*.deb
